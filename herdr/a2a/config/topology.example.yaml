# 拓扑示例。复制到状态目录(默认 ~/.local/state/a2a/topology.yaml)
# 或用环境变量 A2A_TOPOLOGY 指向它。
#
# 程序(TopologyStore)动态修改时会整体重写此文件,不保留注释;上一版保存为 .bak。
version: 1
project_id: soc_a
workspace_label: SoC-A

# role ID 同时用于环境变量 A2A_ROLE 和业务 agent_id 的前缀(dv_uart)。
# 未部署的角色 launcher 可留空,启动时再检查。
roles:
  spec:
    label: Spec智能体
    kind: pi
    launcher: null
  arch:
    label: 架构智能体
    kind: pi
    launcher: null
  rtl:
    label: RTL智能体
    kind: pi
    launcher: null
  dv:
    label: 验证智能体
    kind: pi
    launcher: /home/jhx/.forenyx/fnx_dv/bin/fnx_dv
  sw:
    label: 软件智能体
    kind: pi
    launcher: /home/jhx/.forenyx/fnx_sw/bin/fnx_sw

# 可以为空,之后用 TopologyStore.add_ip 动态添加
ips:
  - uart
  - gpio
  - spi
  - i2c

# 有向边:from -> to。反方向要另写一条。
# 边只描述角色方向,不带 IP;"目标 IP 必须等于发送方 IP"由 Router 强制,配置无法放开。
# 模板目前只允许占位符 {ip}。
edges:
  - id: dv_done
    from: dv
    to: sw
    template: "{ip}已完成 UVM 验证，请开始驱动程序和 HAL 框架开发。"
  - id: dv_to_rtl_fix
    from: dv
    to: rtl
    template: "{ip}验证发现 RTL 问题，请检查并修复。"
